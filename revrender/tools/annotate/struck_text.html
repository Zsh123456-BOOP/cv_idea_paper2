<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>补被划文字</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script async src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" onload="window.katexLoaded && window.katexLoaded()"></script>
<style>
:root { --bg:#f3f3ef; --panel:#fff; --ink:#1e1e1c; --muted:#6b6b65; --rule:#d9d9d2; --sel:#1565c0; --done:#2e7d32; --warn:#b26a00; --field:#fff; --paper:#fff; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#151515; --panel:#1f1f1f; --ink:#ececea; --muted:#9d9d97; --rule:#353531; --sel:#64b5f6; --done:#6fcf79; --warn:#f0b35a; --field:#2a2a28; --paper:#fff; }
}
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; display:flex; flex-direction:column; }
button { font:inherit; padding:3px 10px; border:1px solid var(--rule); border-radius:6px; background:var(--panel); color:var(--ink); cursor:pointer; white-space:nowrap; }
button:hover { border-color:var(--sel); }
button[aria-pressed="true"] { background:var(--sel); color:#fff; border-color:var(--sel); }
button.primary { background:var(--sel); color:#fff; border-color:var(--sel); }
kbd { font:11px ui-monospace, Menlo, monospace; color:var(--muted); margin-left:4px; }
button.primary kbd { color:#dfe9f7; }
.bar { display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; padding:6px 12px; background:var(--panel); border-bottom:1px solid var(--rule); }
.bar .grow { flex:1; }
.bar b { font-size:15px; }
.pill { border-radius:10px; padding:0 9px; background:var(--rule); font-size:12px; }
.pill.done { background:var(--done); color:#fff; }
.chips { display:flex; gap:3px; overflow-x:auto; padding:5px 12px; background:var(--panel); border-bottom:1px solid var(--rule); scrollbar-width:thin; }
.chip { flex:none; min-width:30px; height:22px; font:11px/20px ui-monospace, Menlo, monospace; text-align:center; border:1px solid var(--rule); border-radius:4px; cursor:pointer; color:var(--muted); background:var(--panel); }
.chip.done { background:var(--done); color:#fff; border-color:var(--done); }
.chip.flag { border-color:var(--warn); color:var(--warn); }
.chip.done.flag { background:var(--warn); border-color:var(--warn); color:#fff; }
.chip.cur { outline:2px solid var(--sel); outline-offset:1px; }
.main { flex:1; display:flex; min-height:0; }
.views { flex:1; min-width:0; overflow:auto; padding:12px 16px; display:flex; flex-direction:column; gap:12px; }
.view h3, .side h3 { margin:0 0 4px; font-size:12.5px; font-weight:600; color:var(--muted); }
.frame { position:relative; display:inline-block; background:var(--paper); border:1px solid var(--rule); line-height:0; }
.frame img { display:block; }
.frame svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.page-frame { cursor:zoom-in; }
.side { width:440px; flex:none; border-left:1px solid var(--rule); background:var(--panel); overflow:auto; padding:12px 14px; display:flex; flex-direction:column; gap:12px; }
.meta { color:var(--muted); font-size:12px; }
.question { border:1px solid var(--rule); border-radius:8px; padding:8px 10px; font-size:13px; max-height:45vh; overflow:auto; }
.question summary { cursor:pointer; color:var(--muted); font-size:12.5px; }
.question .md { margin-top:6px; overflow-x:auto; }
.answer { margin-top:6px; padding-top:6px; border-top:1px dashed var(--rule); }
textarea { width:100%; font:16px/1.4 ui-monospace, Menlo, monospace; padding:7px 9px; border:1px solid var(--rule); border-radius:6px; background:var(--field); color:var(--ink); resize:vertical; min-height:58px; }
textarea:focus { outline:2px solid var(--sel); outline-offset:0; border-color:transparent; }
.preview { min-height:30px; padding:6px 9px; border-radius:6px; background:var(--bg); font-size:17px; overflow-x:auto; }
.preview .none { color:var(--muted); font-size:13px; }
.checks { display:flex; flex-wrap:wrap; gap:6px 16px; }
.checks label { display:flex; align-items:center; gap:5px; cursor:pointer; }
input[type=text] { width:100%; font:inherit; padding:5px 8px; border:1px solid var(--rule); border-radius:6px; background:var(--field); color:var(--ink); }
.actions { display:flex; gap:8px; }
.actions button { flex:1; padding:7px 10px; }
.prefill { font-size:12px; color:var(--muted); }
.prefill code { font:12px ui-monospace, Menlo, monospace; color:var(--ink); }
.help { font-size:12.5px; color:var(--muted); border-top:1px solid var(--rule); padding-top:8px; }
.help p { margin:3px 0; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; overflow:auto; z-index:5; padding:24px; cursor:zoom-out; }
.modal.open { display:block; }
.modal .frame { margin:auto; display:block; width:fit-content; }
.saved { font-size:12.5px; padding:1px 8px; border-radius:10px; background:var(--rule); }
.saved.ok { background:var(--done); color:#fff; }
.saved.bad { background:#c62828; color:#fff; }
.banner { background:#c62828; color:#fff; padding:8px 14px; font-weight:600; }
.banner.hint { background:var(--warn); }
.banner button { margin-left:10px; }
.toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:rgba(0,0,0,.78); color:#fff; padding:5px 12px; border-radius:6px; font-size:13px; display:none; z-index:6; }
@media (max-width: 860px) { .main { flex-direction:column; } .side { width:auto; border-left:none; border-top:1px solid var(--rule); } }
</style>
<!--RULES--><script>/* page_rules.js is inlined here */</script><!--/RULES-->
<!--PACK--><script>window.PACK = { id: "empty", regions: [], pages: {}, questions: {} };</script><!--/PACK-->
</head>
<body>
<div class="bar">
  <b>补被划文字</b>
  <span class="pill" id="progress"></span>
  <span class="saved" id="saved">正在打开保存…</span>
  <button id="bind" title="选一个桌面上的文件，之后每次改动都自动写进去">绑定备份文件</button>
  <button id="filter" aria-pressed="false" title="只在没确认的之间跳">只看未完成</button>
  <span class="grow"></span>
  <button id="prev">上一处<kbd>Alt←</kbd></button>
  <button id="next">下一处<kbd>Alt→</kbd></button>
  <button id="import">导入</button>
  <button id="export" class="primary">导出</button>
  <input id="file" type="file" accept=".json,application/json" hidden>
</div>
<div class="banner" id="banner" hidden></div>
<div class="chips" id="chips"></div>
<div class="main">
  <div class="views">
    <div class="view"><h3>原图（蓝框是你精修时的范围）</h3><div class="frame" id="clean-frame"><img id="clean" alt=""><svg id="clean-svg"></svg></div></div>
    <div class="view"><h3>擦掉划线后（你的精修结果）</h3><div class="frame" id="erased-frame"><img id="erased" alt=""></div></div>
    <div class="view"><h3>整份作答（点开放大）</h3><div class="frame page-frame" id="page-frame"><img id="page" alt=""><svg id="page-svg"></svg></div></div>
  </div>
  <div class="side">
    <div class="meta" id="meta"></div>
    <div>
      <h3>被划掉的字（看不清的字写 ?，公式写在 $ $ 里）</h3>
      <textarea id="text" spellcheck="false" placeholder="例：x=5 或 $\frac{1}{2}a$"></textarea>
      <div class="prefill" id="prefill"></div>
    </div>
    <div class="preview" id="preview"></div>
    <div class="checks">
      <label><input type="checkbox" id="unreadable"> 读不出 <kbd>Alt U</kbd></label>
      <label><input type="checkbox" id="notstrike"> 框有问题／不是划线 <kbd>Alt X</kbd></label>
    </div>
    <input type="text" id="note" placeholder="备注（可空）">
    <div class="actions"><button id="confirm" class="primary">确认，下一处<kbd>Enter</kbd></button></div>
    <details class="question" id="question" open><summary id="q-title"></summary><div class="md" id="q-body"></div><div class="answer md" id="q-answer"></div></details>
    <div class="help">
      <p>只写这个框里被划线划掉的原字，没被划的不用写。能认几个写几个，认不出的字写 <code>?</code>。</p>
      <p>Enter 确认并跳到下一处；Shift+Enter 换行。进度自动存在浏览器里，换电脑或清缓存前请先「导出」。</p>
    </div>
  </div>
</div>
<div class="modal" id="modal"><div class="frame" id="big-frame"><img id="big" alt=""><svg id="big-svg"></svg></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const PACK = window.PACK, REGIONS = PACK.regions, KEY = "struck-text:" + PACK.id, SCALE = 6;
const $ = id => document.getElementById(id);
let store = { regions: {} };

// ---------- saving ----------
// Every change is written to IndexedDB and read back, to localStorage, and (once bound) to a backup file on disk; the bar says which
// of them hold the latest state, and a red banner that does not go away says when none does.
const DB_NAME = "paper2-struck-text", DB_STORE = "progress";
let dbOpening = null, backupHandle = null, waitingHandle = null, ready = false, pending = Promise.resolve(), failing = false, unsaved = false;
function db() {
  return dbOpening ||= new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
    r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error);
  });
}
async function dbGet(key) {
  const d = await db();
  return new Promise((resolve, reject) => { const r = d.transaction(DB_STORE).objectStore(DB_STORE).get(key); r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); });
}
async function dbPut(key, value) {
  const d = await db();
  return new Promise((resolve, reject) => {
    const t = d.transaction(DB_STORE, "readwrite"); t.objectStore(DB_STORE).put(value, key);
    t.oncomplete = resolve; t.onerror = () => reject(t.error); t.onabort = () => reject(t.error || Error("保存被中断"));
  });
}
function exported(snapshot) {
  const regions = {};
  for (const r of REGIONS) {
    const e = snapshot.regions[r.id] || entry(r);
    regions[r.id] = { page: r.page, split: r.split, question: PACK.pages[r.page].question, prefill: r.prefill, text: e.text, unreadable: e.unreadable,
                      not_strike: e.not_strike, note: e.note, done: e.done, seconds: e.seconds, confirmed_at: e.confirmed_at || null, edited: !!snapshot.regions[r.id] };
  }
  return { schema: "paper2-struck-text-v1", pack: PACK.id, exported_at: new Date().toISOString(), saved_at: snapshot.savedAt || null, regions };
}
function banner(text, kind) {
  const b = $("banner");
  if (!text) { b.hidden = true; return; }
  b.hidden = false; b.className = "banner" + (kind === "hint" ? " hint" : ""); b.textContent = text;
  if (kind === "hint" && window.showSaveFilePicker) { const k = document.createElement("button"); k.textContent = "现在绑定"; k.onclick = bind; b.appendChild(k); }
  if (kind === "regrant") { const k = document.createElement("button"); k.textContent = "继续写入备份文件"; k.onclick = regrant; b.appendChild(k); }
}
function status(held, problems) {
  const s = $("saved"), time = new Date().toLocaleTimeString();
  failing = !held.length || problems.length > 0;
  s.className = "saved " + (held.length ? (problems.length ? "bad" : "ok") : "bad");
  s.textContent = held.length ? `已保存 ${time} · ${held.join(" + ")}` : "没有保存成功";
  if (!held.length) banner("自动保存失败：" + problems.join("；") + "。请马上点右上角「导出」，再告诉我。", "error");
  else if (problems.length) banner("部分保存失败：" + problems.join("；") + "（" + held.join("、") + " 已保存）。", "error");
  else if (!backupHandle && waitingHandle) banner(`备份文件「${waitingHandle.name}」需要点一下授权才能继续写入（浏览器里已保存）。`, "regrant");
  else if (!backupHandle) banner("进度已存在浏览器里。建议再绑定一个备份文件：之后每次改动都会同时写进这个文件，浏览器数据丢了也不怕。", "hint");
  else banner(null);
}
async function persist(snapshot) {
  const held = [], problems = [];
  try {
    await dbPut(KEY, snapshot);
    const back = await dbGet(KEY);
    if (!back || back.savedAt !== snapshot.savedAt) throw Error("读回不一致");
    held.push("浏览器数据库");
  } catch (e) { problems.push("浏览器数据库 " + (e && e.message || e)); }
  try {
    localStorage.setItem(KEY, JSON.stringify(snapshot));
    if (JSON.parse(localStorage.getItem(KEY)).savedAt !== snapshot.savedAt) throw Error("读回不一致");
    held.push("浏览器本地");
  } catch (e) { if (!held.length) problems.push("浏览器本地 " + (e && e.message || e)); }
  if (backupHandle) {
    try {
      const w = await backupHandle.createWritable();
      await w.write(JSON.stringify(exported(snapshot), null, 1)); await w.close();
      held.push("备份文件 " + backupHandle.name);
    } catch (e) { problems.push("备份文件 " + (e && e.message || e)); }
  }
  status(held, problems);
  unsaved = !held.length;
}
function save() {
  store.savedAt = new Date().toISOString(); unsaved = true;
  const snapshot = JSON.parse(JSON.stringify(store));
  pending = pending.catch(() => {}).then(() => persist(snapshot));
  return pending;
}
async function bind() {
  try {
    backupHandle = await window.showSaveFilePicker({ suggestedName: `补被划文字_自动备份_${PACK.id}.json`, types: [{ description: "标注 JSON", accept: { "application/json": [".json"] } }] });
    try { await dbPut(KEY + ":backup", backupHandle); } catch (e) {}
    await save(); toast("已绑定备份文件：" + backupHandle.name);
  } catch (e) { if (e && e.name !== "AbortError") toast("绑定失败：" + e.message); }
}
async function regrant() {
  try { if (await waitingHandle.requestPermission({ mode: "readwrite" }) === "granted") { backupHandle = waitingHandle; waitingHandle = null; await save(); return; } } catch (e) {}
  toast("没有授权，备份文件暂不写入");
}
async function load() {
  // The newest of what IndexedDB and localStorage hold (by savedAt).
  const found = [];
  try { const v = await dbGet(KEY); if (v) found.push(v); } catch (e) {}
  try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v) found.push(v); } catch (e) {}
  found.sort((a, b) => String(b.savedAt || "").localeCompare(String(a.savedAt || "")));
  store = found[0] || { regions: {} };
  if (!store.regions) store.regions = {};
  // Only what the annotator did is stored; a region nobody touched shows the pack's starting text, so a rebuilt page's new text reaches it.
  for (const [id, e] of Object.entries(store.regions)) if (!e.done && !e.edited) delete store.regions[id];
  try {
    const h = await dbGet(KEY + ":backup");
    if (h && h.queryPermission) { if (await h.queryPermission({ mode: "readwrite" }) === "granted") backupHandle = h; else waitingHandle = h; }
  } catch (e) {}
  ready = true;
  await save();          // once at opening, so a browser that cannot keep anything says so before any work is done
}
window.addEventListener("beforeunload", ev => { if (unsaved || failing) { ev.preventDefault(); ev.returnValue = ""; } });
let current = 0, onlyOpen = false, lastAction = null;

function entry(r) {
  // The stored record of a region, or (not stored) its starting state.
  return store.regions[r.id] || { text: r.prefill || "", unreadable: !!r.unreadable, not_strike: false, note: "", done: false, seconds: 0 };
}
function stored(r) { if (!store.regions[r.id]) store.regions[r.id] = { ...entry(r), edited: true }; return store.regions[r.id]; }
function flagged(e) { return e.unreadable || e.not_strike; }
function toast(text) { const t = $("toast"); t.textContent = text; t.style.display = "block"; clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = "none", 1800); }

// Time on a region: the gaps between the annotator's actions on it, each counted up to IDLE seconds (page_rules.js).
function touch() {
  const now = Date.now() / 1000, e = stored(REGIONS[current]);
  if (lastAction && lastAction.region === current) e.seconds = Math.round((e.seconds + activeSeconds([now - lastAction.at])) * 10) / 10;
  lastAction = { region: current, at: now };
}

function escapeHtml(text) { return text.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function math(text, display) {
  return window.katex ? window.katex.renderToString(text, { throwOnError: false, strict: "ignore", displayMode: display, output: "html" })
                      : escapeHtml(display ? "$$" + text + "$$" : "$" + text + "$");
}
function rendered(text) {
  const parts = mathParts(text);
  if (!parts.length) return '<span class="none">（还没有字）</span>';
  return parts.map(p => p.math ? math(p.text, false) : escapeHtml(p.text)).join("");
}
function markdown(text) {
  // The question's markdown: $$ $$ and $ $ formulas, line breaks; an image link shown as its link.
  const out = [], re = /\$\$([\s\S]+?)\$\$|\$([^$]+?)\$|!\[[^\]]*\]\(([^)]+)\)/g;
  let last = 0, m;
  const words = s => escapeHtml(s).replace(/^#{1,6} +(.*)$/gm, "<b>$1</b>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
  while ((m = re.exec(text))) {
    out.push(words(text.slice(last, m.index)));
    out.push(m[1] !== undefined ? math(m[1], true) : m[2] !== undefined ? math(m[2], false) : '<a href="' + escapeHtml(m[3]) + '" target="_blank" rel="noopener">[题图]</a>');
    last = re.lastIndex;
  }
  out.push(words(text.slice(last)));
  return out.join("");
}

function fit(img, natural, room) {
  const w = Math.max(1, Math.min(room, natural[0] * SCALE));
  img.style.width = w + "px"; img.style.height = (w * natural[1] / natural[0]) + "px";
}
function outline(svg, size, polygon, offset, width) {
  svg.setAttribute("viewBox", `0 0 ${size[0]} ${size[1]}`);
  svg.setAttribute("preserveAspectRatio", "none");
  const points = polygon.map(([x, y]) => `${x - offset[0]},${y - offset[1]}`).join(" ");
  svg.innerHTML = `<polygon points="${points}" fill="rgba(21,101,192,.06)" stroke="#1565c0" stroke-width="${width}" stroke-dasharray="${2 * width} ${width}" vector-effect="non-scaling-stroke"/>`;
}
function polygonOf(r) { const [l, t, rr, b] = r.box; return r.region && r.region.length >= 3 ? r.region : [[l, t], [rr, t], [rr, b], [l, b]]; }

function show(k) {
  if (!REGIONS.length) { $("meta").textContent = "这个包里没有区域。"; return; }
  current = (k + REGIONS.length) % REGIONS.length; lastAction = { region: current, at: Date.now() / 1000 };   // reading the region counts
  const r = REGIONS[current], e = entry(r), page = PACK.pages[r.page], q = PACK.questions[page.question];
  const crop = [r.crop[2] - r.crop[0], r.crop[3] - r.crop[1]], room = $("clean-frame").parentElement.clientWidth - 4;
  $("clean").src = r.clean; $("erased").src = r.erased; $("page").src = page.image;
  fit($("clean"), crop, room); fit($("erased"), crop, room);
  outline($("clean-svg"), crop, polygonOf(r), [r.crop[0], r.crop[1]], 1.5);
  const pw = Math.min(room, 900); $("page").style.width = pw + "px"; $("page").style.height = (pw * page.size[1] / page.size[0]) + "px";
  outline($("page-svg"), page.size, [[r.crop[0], r.crop[1]], [r.crop[2], r.crop[1]], [r.crop[2], r.crop[3]], [r.crop[0], r.crop[3]]], [0, 0], 2.5);
  $("meta").textContent = `第 ${current + 1} / ${REGIONS.length} 处 · ${r.split === "val" ? "验证" : "训练"} · ${r.page}`;
  $("q-title").textContent = q ? `第 ${q.printed_problem_no} 题 · ${q.source_exam_title}（题目与标准解答）` : "（没有对应的题目）";
  $("q-body").innerHTML = q ? markdown(q.problem_statement_markdown) : "";
  $("q-answer").innerHTML = q ? "<b>标准解答：</b><br>" + markdown(q.standard_solution_markdown) + "<br><b>答案：</b>" + markdown(q.final_answer) : "";
  $("text").value = e.text; $("unreadable").checked = e.unreadable; $("notstrike").checked = e.not_strike; $("note").value = e.note;
  $("prefill").innerHTML = r.prefill ? "模型初稿：<code>" + escapeHtml(r.prefill) + "</code>" : "模型初稿：（空）";
  $("preview").innerHTML = rendered(e.text);
  renderChips(); renderProgress();
  const t = $("text"); t.focus(); t.setSelectionRange(t.value.length, t.value.length);
}
function renderProgress() {
  const done = REGIONS.filter(r => entry(r).done).length;
  $("progress").textContent = `已确认 ${done} / ${REGIONS.length}`;
  $("progress").className = "pill" + (done === REGIONS.length && done ? " done" : "");
}
function renderChips() {
  const box = $("chips");
  if (box.children.length !== REGIONS.length) {
    box.replaceChildren(...REGIONS.map((r, i) => { const c = document.createElement("div"); c.className = "chip"; c.textContent = i + 1; c.onclick = () => show(i); return c; }));
  }
  REGIONS.forEach((r, i) => {
    const e = entry(r), c = box.children[i];
    c.className = "chip" + (e.done ? " done" : "") + (flagged(e) ? " flag" : "") + (i === current ? " cur" : "");
  });
  box.children[current].scrollIntoView({ block: "nearest", inline: "nearest" });
}
function step(direction) {
  for (let n = 1; n <= REGIONS.length; n++) {
    const k = (current + direction * n + REGIONS.length) % REGIONS.length;
    if (!onlyOpen || !entry(REGIONS[k]).done) return show(k);
  }
  toast("全部确认完了");
}
function edit(field, value) { if (!ready) return; touch(); const e = stored(REGIONS[current]); e[field] = value; save(); if (field === "text") $("preview").innerHTML = rendered(value); renderChips(); }
function confirmRegion() {
  if (!ready) return;
  touch(); const e = stored(REGIONS[current]);
  e.done = true; e.confirmed_at = new Date().toISOString(); save(); renderProgress(); step(1);
}

$("text").addEventListener("input", ev => edit("text", ev.target.value));
$("text").addEventListener("keydown", ev => {
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); confirmRegion(); }
});
$("unreadable").addEventListener("change", ev => edit("unreadable", ev.target.checked));
$("notstrike").addEventListener("change", ev => edit("not_strike", ev.target.checked));
$("note").addEventListener("input", ev => edit("note", ev.target.value));
$("note").addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.isComposing) { ev.preventDefault(); confirmRegion(); } });
$("confirm").onclick = confirmRegion;
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("filter").onclick = () => { onlyOpen = !onlyOpen; $("filter").setAttribute("aria-pressed", String(onlyOpen)); };
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { $("modal").classList.remove("open"); return; }
  if (!ev.altKey) return;
  const k = ev.code;
  if (k === "ArrowLeft") { ev.preventDefault(); step(-1); }
  else if (k === "ArrowRight") { ev.preventDefault(); step(1); }
  else if (k === "KeyU") { ev.preventDefault(); $("unreadable").checked = !$("unreadable").checked; edit("unreadable", $("unreadable").checked); }
  else if (k === "KeyX") { ev.preventDefault(); $("notstrike").checked = !$("notstrike").checked; edit("not_strike", $("notstrike").checked); }
});
$("page-frame").onclick = () => {
  const r = REGIONS[current], page = PACK.pages[r.page], w = Math.min(window.innerWidth - 48, page.size[0]);
  $("big").src = page.image; $("big").style.width = w + "px"; $("big").style.height = (w * page.size[1] / page.size[0]) + "px";
  outline($("big-svg"), page.size, [[r.crop[0], r.crop[1]], [r.crop[2], r.crop[1]], [r.crop[2], r.crop[3]], [r.crop[0], r.crop[3]]], [0, 0], 2.5);
  $("modal").classList.add("open");
};
$("modal").onclick = () => $("modal").classList.remove("open");

$("export").onclick = () => {
  const value = exported(store);
  const blob = new Blob([JSON.stringify(value, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `补被划文字_${PACK.id}_${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("import").onclick = () => $("file").click();
$("file").onchange = async ev => {
  const file = ev.target.files[0]; if (!file) return;
  try {
    const value = JSON.parse(await file.text());
    if (value.schema !== "paper2-struck-text-v1") throw new Error("不是补被划文字的导出");
    let n = 0;
    for (const r of REGIONS) {
      const v = value.regions[r.id]; if (!v) continue;
      store.regions[r.id] = { text: v.text || "", unreadable: !!v.unreadable, not_strike: !!v.not_strike, note: v.note || "", done: !!v.done,
                              seconds: v.seconds || 0, confirmed_at: v.confirmed_at || null, edited: true };
      n++;
    }
    save(); show(current); toast(`导入了 ${n} 处`);
  } catch (e) { toast("导入失败：" + e.message); }
  ev.target.value = "";
};
window.addEventListener("resize", () => show(current));
$("bind").onclick = bind;
if (!window.showSaveFilePicker) $("bind").hidden = true;
window.katexLoaded = () => show(current);
load().then(() => show(Math.max(0, REGIONS.findIndex(r => !entry(r).done))));
</script>
</body>
</html>
