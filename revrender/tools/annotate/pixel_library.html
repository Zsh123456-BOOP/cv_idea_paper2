<style>body{font:16px/1.65 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:#f2f5f8;color:#243247;max-width:1150px;margin:25px auto;padding:0 22px}h1{font-size:26px}button,select{font:inherit;padding:9px 15px;border:1px solid #bbcadd;border-radius:8px;background:white;cursor:pointer}button.primary{background:#2457ad;color:white}#toolbar{display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#f2f5f8;padding:12px 0}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}article{background:white;border:1px solid #d7e0ea;border-radius:10px;padding:16px}a{color:#2457ad}small{color:#61718a}.error{color:#a92828}#status{min-height:30px}input[type=file]{display:none}progress{width:100%}</style>
<h1>全部涂改 · 筛选与精修</h1><p id="summary">正在读取进度…</p>
<p>模型已预标全部检测到的涂改。好的直接确认，差一点的局部修改，难的先跳过。你决定看多少、何时导出。每组只是分开放图，避免页面卡顿。</p>
<div id="toolbar"><button id="resume" class="primary">继续筛选</button><button id="export">导出全部已查看进度</button><button id="train">导出已确认训练数据</button><button id="import">导入全量备份 / 旧标注</button><input id="file" type="file" accept="application/json"><select id="filter"><option value="all">所有题组</option><option value="pending">未全部确认</option><option value="started">已开始</option></select></div>
<p id="status" role="status"></p><small>修改自动保存在本浏览器的 IndexedDB。换浏览器、移动到另一台电脑前请导出备份；保留整个目录，无需启动服务器。验证和测试题可查看、可标注，但不会进入“已确认训练数据”。未确认预测不作为训练答案。原 108 处页面独立保留；在那里新做的修改，可导出 JSON 后从这里导入。</small>
