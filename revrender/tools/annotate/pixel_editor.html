<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>划线精细复核</title><style>
:root{color-scheme:light;--bg:#f4f5f7;--ink:#192635;--muted:#667382;--line:#dce1e7;--blue:#235cca;--green:#137660}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
button,input,textarea{font:inherit}button{background:white;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer}button:hover{border-color:var(--blue)}button:disabled{opacity:.45;cursor:wait}button.active,button.primary{background:var(--blue);color:white;border-color:var(--blue)}button.done{color:var(--green)}
header{padding:16px 24px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:20px;margin:0}small,.muted{color:var(--muted);font-size:13px}main{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:calc(100vh - 88px)}aside{padding:16px;background:white;border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 88px)}aside button{display:block;width:100%;text-align:left;margin:5px 0}.question{margin:15px 0 5px;font-weight:650;font-size:13px}.content{padding:20px;min-width:0}.titlebar,.toolbar,.footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.titlebar{justify-content:space-between;margin-bottom:12px}.titlebar h2{font-size:18px;margin:0}.hint{padding:10px 14px;background:#eaf0fc;border-radius:8px;margin-bottom:14px;color:#344f7f}.toolbar{background:white;padding:12px;border:1px solid var(--line);border-radius:10px 10px 0 0}.separator{height:25px;border-left:1px solid var(--line);margin:0 3px}.views{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-top:0}.view{background:white;min-width:0}.view strong{display:block;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--line)}.canvaswrap{min-height:220px;max-height:50vh;overflow:auto;padding:24px;display:flex;align-items:flex-start;justify-content:flex-start}canvas{background:white;image-rendering:pixelated;touch-action:none;flex-shrink:0}#edit{cursor:crosshair}.footer{padding:14px 0;justify-content:space-between}.status{min-height:26px;font-size:13px;color:var(--muted)}.error{color:#b5362a}.notes{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}.notes input[type=text]{min-width:250px;border:1px solid var(--line);border-radius:5px;padding:6px}dialog{border:1px solid var(--line);border-radius:10px;max-width:95vw;max-height:94vh;padding:16px}dialog::backdrop{background:#19263588}.overview{overflow:auto;max-height:74vh}#whole{max-width:none;cursor:crosshair}kbd{font:11px monospace;background:#edf0f4;color:#5b6879;padding:2px 4px;border-radius:3px}#import{display:none}
@media(max-width:850px){main{grid-template-columns:145px minmax(0,1fr)}aside{padding:8px}.content{padding:10px}.views{grid-template-columns:1fr}.canvaswrap{min-height:160px;max-height:40vh}header{padding:12px}.toolbar{gap:5px}.toolbar button{padding:7px}}
</style></head><body>
<header><div><h1>划线精细复核</h1><small>模型先标，你来修正。确认后的掩膜才作为人工标注。</small></div><div><span id="progress"></span> <button id="importBtn">导入</button> <button id="exportBtn">导出标注</button><input id="import" type="file" accept="application/json"></div></header>
<main><aside id="nav"></aside><section class="content">
<div class="titlebar"><h2 id="title">正在载入…</h2><div><button id="overviewBtn">看整题 / 补一个区域</button> <button id="pageDone">确认整题检查完成</button></div></div>
<div class="hint">先看右侧有没有伤到字。漏掉的划线用“补漏擦”，误擦的字用“保留文字”；细节可直接用画笔修改。</div>
<div class="toolbar"><button data-mode="add" class="active">＋ 补漏擦</button><button data-mode="keep">− 保留文字</button><span class="separator"></span><button data-mode="paint">画笔</button><button data-mode="erase">橡皮</button><label><small>笔宽</small> <input id="radius" type="range" min="1" max="10" value="2" style="width:80px"></label><button id="undo">撤销 <kbd>⌘Z</kbd></button><button id="redo">重做</button><span class="separator"></span><button id="less">−</button><span id="zoomLabel">3×</span><button id="more">＋</button><button id="hide">隐藏标记 <kbd>H</kbd></button></div>
<div class="views"><div class="view"><strong>原图 · 红色部分会被擦除</strong><div class="canvaswrap"><canvas id="edit"></canvas></div></div><div class="view"><strong>擦除结果 · 检查文字笔画是否完整</strong><div class="canvaswrap"><canvas id="result"></canvas></div></div></div>
<div class="notes"><label><input type="checkbox" id="notRevision"> 这处不是划线涂改</label><label>备注 <input id="note" type="text" placeholder="例如：这里交叉，暂时拿不准"></label></div>
<div id="status" class="status" aria-live="polite"></div>
<div class="footer"><div><button id="previous">上一处 <kbd>P</kbd></button> <button id="next">下一处 <kbd>N</kbd></button></div><button class="primary" id="confirm">确认这处并继续 <kbd>空格</kbd></button></div>
<small>自动保存在本浏览器；建议每标完几题导出一次。时间和修改次数会随标注导出。</small>
</section></main>
<dialog id="dialog"><div class="titlebar"><strong id="wholeTitle">整题检查</strong><div><span class="muted">漏检时，在图上拖出一个框。</span> <button id="wholeDone">确认整题检查完成</button> <button id="closeDialog">关闭</button></div></div><div class="overview"><canvas id="whole"></canvas></div></dialog>
<script src="pixel_editor.js"></script></body></html>
