# Frozen synthetic-only task adaptation. Not original benchmark reproduction.
# Common: darken-only v4 gold_pixels, 10788 train / 596 val, 256 native tiles.
# Selection: max real validation removal F1, threshold .2; no test access.
# No minimum-damage constraint invented after seeing validation outcomes.
# Different recipe budgets are explicit, no ranking solely by update count.
# DocDiff raw/official EMA are predeclared candidates, same validation only.

[training.COR-Generator]
steps = 80910 # 30 * 10788 / 4 expected exposures; sampled batches
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 80910
patience = 0

[training.Strikethrough-CycleGAN]
steps = 80910
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 80910
patience = 0

[training.NAFNet]
steps = 80000
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 40000
patience = 6

# Ours (models.separation, plan 2026-10-25): NAFNet's budget; the hint simulated on synthetic pairs (data.separation).  The head
# weights were set once, then fixed: over the first 1,000 synthetic steps at weight 1 the composed image term's gradient was a
# median 92 times the erase term's (the cross term's 207; paper2_clean_revsep_calibration), so both 100.
[training.RevSep]
steps = 80000
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 40000
patience = 6
hint_reach = 5
hint_drop = 0.3
erase_weight = 100.0
cross_weight = 100.0
# With --reader only (the fine-tuning on the human regions): at weight 1 the reading term's gradient was a median 3.3 times the
# composed image term's over the first 200 fine-tuning steps (paper2_clean_revsep_reading_calibration), so a tenth of it: 0.03.
reading_weight = 0.03
# With --stroke only (head A): set once from the gradient balance of a smoke run, then fixed.
centre_weight = 1.0
width_weight = 1.0
stroke_weight = 1.0

[training.Restormer]
steps = 80000
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 40000
patience = 6

[training.DocDiff]
steps = 100000
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 50000
patience = 6
ema = true

[training.DE-GAN]
steps = 80000
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 40000
patience = 6

# WACV 2025 supplement; random initialization, same paired data and validation.
# Author MSE + .2 SSIM at both stages, AdamW 2e-4, scaled cosine to 1e-6.
[training.StainRestorer]
steps = 80000
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 40000
patience = 6

# Fine-tuning every restorer on the box remover's 201 human regions plus its synthetic replay (2026-10-22, user: same real
# annotations for every model, versions chosen on validation read-back): as many passes over the set as the box remover's own
# fine-tuning (revrender_strokes_human.toml: 800 steps x 8 over 498 rows), a tenth of each recipe's learning rate, four
# validations, from the version chosen on read-back after synthetic training.  No early stop.
[finetune]
passes = 12.85
learning_rate_scale = 0.1
evaluations = 4

# Two arms against [finetune] (2026-10-23, user: does the synthetic data hold the restorers back?), on the human regions alone (no
# synthetic replay): [finetune_long] from the same chosen synthetic version, four times the passes and twice the evaluations;
# [real_only] from the restorer's own random initialisation, its full learning rate, as many updates as a short synthetic run.
[finetune_long]
passes = 51.4
learning_rate_scale = 0.1
evaluations = 8

[real_only]
passes = 180
learning_rate_scale = 1.0
evaluations = 10

# A student on the pseudo-labelled library (data.pseudo_regions, scripts/run_pseudo_student.sh; 2026-10-25): from the same chosen
# synthetic version as [finetune_long], a tenth of the learning rate, a few passes over ten thousand regions.
[pseudo]
passes = 4
learning_rate_scale = 0.1
evaluations = 8
