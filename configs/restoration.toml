# Frozen synthetic-only task adaptation. Not original benchmark reproduction.
# Common: darken-only v4 gold_pixels, 10788 train / 596 val, 256 native tiles.
# Selection: max real validation removal F1, threshold .2; no test access.
# No minimum-damage constraint invented after seeing validation outcomes.
# Different recipe budgets are explicit, no ranking solely by update count.
# DocDiff raw/official EMA are predeclared candidates, same validation only.

[training.COR-Generator]
steps = 80910 # 30 * 10788 / 4 expected exposures; sampled batches
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 80910
patience = 0

[training.Strikethrough-CycleGAN]
steps = 80910
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 80910
patience = 0

[training.NAFNet]
steps = 80000
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 40000
patience = 6

[training.Restormer]
steps = 80000
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 40000
patience = 6

[training.DocDiff]
steps = 100000
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 50000
patience = 6
ema = true

[training.DE-GAN]
steps = 80000
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 40000
patience = 6

# WACV 2025 supplement; random initialization, same paired data and validation.
# Author MSE + .2 SSIM at both stages, AdamW 2e-4, scaled cosine to 1e-6.
[training.StainRestorer]
steps = 80000
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 40000
patience = 6

# The three baselines added for the method stage (plan of 2026-11-18); their own recipes are in their modules, a budget sets the steps.
# CycleGAN-A: ATTR_GUIDED of the release (attribute = annotation mode); VCGAN: the release's batch 1 (gradient fix); DocRes: one task.
# NAFNet-hint (plan of 2026-11-20): NAFNet's recipe with the hint as a second input channel and an output that only takes ink away.
[training.Strikethrough-CycleGAN-A]
steps = 80910
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 80910
patience = 0

[training.VCGAN]
steps = 80000
batch_size = 1
eval_every = 5000
validation_limit = 64
min_steps = 40000
patience = 6

[training.NAFNet-hint]
steps = 80000
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 40000
patience = 6

[training.DocRes]
steps = 80000
batch_size = 4
eval_every = 5000
validation_limit = 64
min_steps = 40000
patience = 6

# Fine-tuning every restorer on the box remover's 201 human regions plus its synthetic replay (2026-10-22, user: same real
# annotations for every model, versions chosen on validation read-back): as many passes over the set as the box remover's own
# fine-tuning (revrender_strokes_human.toml: 800 steps x 8 over 498 rows), a tenth of each recipe's learning rate, four
# validations, from the version chosen on read-back after synthetic training.  No early stop.
[finetune]
passes = 12.85
learning_rate_scale = 0.1
evaluations = 4

# Two arms against [finetune] (2026-10-23, user: does the synthetic data hold the restorers back?), on the human regions alone (no
# synthetic replay): [finetune_long] from the same chosen synthetic version, four times the passes and twice the evaluations;
# [real_only] from the restorer's own random initialisation, its full learning rate, as many updates as a short synthetic run.
[finetune_long]
passes = 51.4
learning_rate_scale = 0.1
evaluations = 8

[real_only]
passes = 180
learning_rate_scale = 1.0
evaluations = 10

# A student on the pseudo-labelled library (data.pseudo_regions, scripts/run_pseudo_student.sh; 2026-10-25): from the same chosen
# synthetic version as [finetune_long], a tenth of the learning rate, a few passes over ten thousand regions.
[pseudo]
passes = 4
learning_rate_scale = 0.1
evaluations = 8

# The prefill model (plan 预填模型, scripts/run_prefill_model.sh; 2026-10-25): real data and pseudo-labelled regions only, from NAFNet's
# own random start, six passes over them, a version every twelfth (kept when the held-out writers' pixels to fix fall: --select edits).
[prefill]
passes = 6
learning_rate_scale = 1.0
evaluations = 12

# Method stage, first round (plan 基线统一训练第一轮, 2026-11-18): every restorer from its own random start on the training writers of
# configs/method_split.json, each to its own convergence by one rule: a validation every 10 passes (removal F1 inside the regions of
# the validation writers), at least 100 passes, stopped after 6 validations in a row none 0.1 point above the best so far, at most 400.
[method_round1]
passes = 400
evaluations = 40
min_passes = 100
patience = 6
min_delta = 0.001
learning_rate_scale = 1.0

# Its smoke test (scripts/run_method_baselines.sh PART=smoke): two passes, two validations, no stop.
[method_smoke]
passes = 2
evaluations = 2
learning_rate_scale = 1.0
