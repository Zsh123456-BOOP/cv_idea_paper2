[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revrender"
version = "0.1.0"
description = "RevRender (paper 1) and its evaluation and baselines, ported as one package for paper 2"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pillow"]

[project.optional-dependencies]
# Model, training and the CNN baselines (server: /home/zsh/hme/envs/hme).
torch = ["torch", "torchvision", "segmentation-models-pytorch"]
# Component-based baselines (component classifier, shape-feature methods, MathScrub).
baselines = ["scikit-learn", "scikit-image", "joblib"]
test = ["pytest"]

[project.scripts]
rvr-train = "revrender.train:main"
rvr-infer = "revrender.infer:main"
rvr-pages = "revrender.pages:main"
rvr-freeze = "revrender.eval.freeze:main"
rvr-report = "revrender.eval.report:main"
rvr-ap = "revrender.eval.ap:main"
rvr-fates = "revrender.eval.fates:main"
rvr-bootstrap = "revrender.eval.bootstrap:main"
rvr-representation = "revrender.eval.representation:main"
rvr-pixel-errors = "revrender.eval.pixel_errors:main"
rvr-speed = "revrender.eval.speed:main"
rvr-compare-trace = "revrender.tools.compare_trace:main"
rvr-native-train = "revrender.baselines.native.train:main"
rvr-native-threshold = "revrender.baselines.native.threshold:main"
rvr-component-cls = "revrender.baselines.component_cls:main"
rvr-strike-removal = "revrender.baselines.removal:main"
rvr-paper-baselines = "revrender.baselines.paper:main"
rvr-mathscrub = "revrender.baselines.mathscrub:main"
rvr-annotate-page = "revrender.tools.annotate.single_file:main"

[tool.setuptools.packages.find]
include = ["revrender*"]

[tool.setuptools.package-data]
"revrender.tools.annotate" = ["*.html"]
"revrender.tools" = ["*.html", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
